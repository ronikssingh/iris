name: Probe services

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run the catalogue code against the real services
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN || secrets.TMBD_TOKEN }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: |
          npm i --no-save --no-package-lock esbuild@0.28.2 > /dev/null
          npx esbuild catalog-probe.ts --bundle --platform=node --format=esm --target=node22 --alias:electron=./electron-stub.js --outfile=probe.mjs --log-level=warning
          node probe.mjs
          node raw-probe.mjs
          # the keys must never appear in what gets published
          for v in "$TMDB_TOKEN" "$IGDB_CLIENT_ID" "$IGDB_CLIENT_SECRET"; do
            if [ -n "$v" ] && grep -qF "$v" catalog-report.json catalog-calls.json raw-report.json; then echo "::error::a key leaked into the output"; exit 1; fi
          done
      - name: Publish the report
        run: |
          mkdir -p /tmp/out && cp catalog-report.json catalog-calls.json raw-report.json /tmp/out/
          cd /tmp/out
          git init -q -b probe-results
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Probe report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
