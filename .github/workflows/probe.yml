name: Probe services

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node probe.mjs > report.json; cat report.json | head -c 3000
      - name: Publish the report
        run: |
          mkdir -p /tmp/out && cp report.json /tmp/out/
          cd /tmp/out
          git init -q -b probe-results
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add report.json
          git commit -q -m "Probe report"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-results
