name: Probe services

on:
  push:
    branches: [probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which secret names exist
        env:
          S_TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          S_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          S_TMDB_KEY: ${{ secrets.TMDB_KEY }}
          S_TMDB: ${{ secrets.TMDB }}
          S_TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          S_TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          S_TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          S_TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
          S_TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}
          S_TMDB_BEARER: ${{ secrets.TMDB_BEARER }}
          S_TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          S_TMDB_V4: ${{ secrets.TMDB_V4 }}
          S_TMDB_API: ${{ secrets.TMDB_API }}
          S_THEMOVIEDB_TOKEN: ${{ secrets.THEMOVIEDB_TOKEN }}
          S_THEMOVIEDB_API_KEY: ${{ secrets.THEMOVIEDB_API_KEY }}
          S_TMBD_TOKEN: ${{ secrets.TMBD_TOKEN }}
          S_TMDB_TOKEN_: ${{ secrets.TMDB_TOKEN_ }}
          S_API_READ_ACCESS_TOKEN: ${{ secrets.API_READ_ACCESS_TOKEN }}
          S_READ_ACCESS_TOKEN: ${{ secrets.READ_ACCESS_TOKEN }}
          S_API_KEY: ${{ secrets.API_KEY }}
          S_TMDB_SECRET: ${{ secrets.TMDB_SECRET }}
          S_TMDB_READ: ${{ secrets.TMDB_READ }}
          S_TMDBTOKEN: ${{ secrets.TMDBTOKEN }}
          S_TMDB_API_READ_TOKEN: ${{ secrets.TMDB_API_READ_TOKEN }}
          S_MOVIE_DB_TOKEN: ${{ secrets.MOVIE_DB_TOKEN }}
          S_TMDB_AUTH: ${{ secrets.TMDB_AUTH }}
          S_TMDB_ACCESS: ${{ secrets.TMDB_ACCESS }}
          S_TMDB_KEY_V4: ${{ secrets.TMDB_KEY_V4 }}
          S_TMDB_V3: ${{ secrets.TMDB_V3 }}
          S_TMDB_API_V4: ${{ secrets.TMDB_API_V4 }}
        run: |
          out=""
          for v in $(env | grep '^S_' | cut -d= -f1); do val="${!v}"; if [ -n "$val" ]; then out="$out ${v#S_}(${#val} chars)"; fi; done
          echo "found:$out"
          echo "::warning title=Secrets::found:$out"
