name: Build and release Iris

# Every push to main checks the version in package.json. If there is no
# finished release for that version yet, Iris is built on a Mac and on
# Windows and published as release v<version>. Bump the version to ship
# a new release; run the workflow by hand to rebuild the current one.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        name: Is a release needed?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          assets=$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          build=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "$assets" -lt 4 ]; then build=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Version $version has $assets release files; build=$build"

  mac:
    name: Mac (Apple silicon)
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Retina background for the disk image
        run: tiffutil -cathidpicheck build/background.png build/background@2x.png -out build/background.tiff

      - name: Package
        run: |
          set -o pipefail
          npx electron-builder --mac --arm64 --publish never 2>&1 | tee package.log

      - name: Check the signature
        run: |
          set -o pipefail
          {
            codesign --verify --deep --strict --verbose=2 release/mac-arm64/Iris.app
            codesign -dv release/mac-arm64/Iris.app
          } 2>&1 | tee -a package.log

      - name: Explain a failure
        if: failure()
        run: |
          log=$(tail -n 60 package.log 2>/dev/null || echo "no log")
          log="${log//'%'/'%25'}"; log="${log//$'\n'/'%0A'}"; log="${log//$'\r'/'%0D'}"
          echo "::error title=Mac packaging failed::$log"

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            release/Iris-mac-arm64.dmg
            release/Iris-mac-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Package
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee package.log

      - name: Explain a failure
        if: failure()
        run: |
          log=$(tail -n 60 package.log 2>/dev/null || echo "no log")
          log="${log//'%'/'%25'}"; log="${log//$'\n'/'%0A'}"; log="${log//$'\r'/'%0D'}"
          echo "::error title=Windows packaging failed::$log"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/Iris-Setup-win-x64.exe
            release/Iris-Portable-win-x64.exe
          if-no-files-found: error

  release:
    name: Publish
    needs: [plan, mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls -la out
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" out/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Iris $VERSION" \
              --notes-file .github/release-notes.md \
              --latest
          fi
